[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kit-charte"
version = "0.1.0"
description = "Kit de modèles Word et PowerPoint aux couleurs de la charte graphique"
requires-python = ">=3.11"
dependencies = ["python-docx", "python-pptx"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kit-charte = "kit_charte.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
